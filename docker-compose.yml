version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: task-manager-db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: task-manager
    networks:
      - task-manager-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./task-manager-backend
      dockerfile: Dockerfile
    container_name: task-manager-api
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/task-manager
      JWT_SECRET: ${JWT_SECRET:-your_secret_key_change_in_production}
      JWT_EXPIRE: 7d
      PORT: 5000
      NODE_ENV: development
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - task-manager-network
    volumes:
      - ./task-manager-backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./task-manager-frontend
      dockerfile: Dockerfile
    container_name: task-manager-web
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - task-manager-network
    volumes:
      - ./task-manager-frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  mongodb_data:

networks:
  task-manager-network:
    driver: bridge
